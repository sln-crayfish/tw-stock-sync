name: Update daily K-line data

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # 08:35 UTC = 16:35 Asia/Taipei.
    - cron: "35 8 * * *"
    # 08:52 UTC = 16:52 Asia/Taipei.
    - cron: "52 8 * * *"
    # 09:16 UTC = 17:16 Asia/Taipei.
    - cron: "16 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-daily-kline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Update today K-line data
        run: |
          set -o pipefail
          npm run update:today 2>&1 | tee update.log

      - name: Commit and push data changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(data): update daily kline"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify Discord on success
        if: success() && steps.commit.outputs.changed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not set; skipping Discord notification."
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          UPDATE_INFO="$(grep -E '^(Quote date|TWSE quotes|TPEx quotes|Total symbols with quotes|Updated|Corrected same date|Unchanged|Created new files|Skipped|Invalid files|No quote):' update.log || true)"
          if [ -z "$UPDATE_INFO" ]; then
            UPDATE_INFO="No update summary was found in the workflow log."
          fi

          {
            echo "[台股日 K 更新完成]"
            echo
            echo "$UPDATE_INFO"
            echo "---"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Run: ${RUN_URL}"
          } > discord-message.txt

          jq -n --rawfile content discord-message.txt '{content: $content}' > discord-payload.json
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            --data @discord-payload.json
